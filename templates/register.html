{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <div class="form-box">
        <h1 class="h3 mb-4 text-center">Create an account</h1>
        <form action="/register" method="post">
            <div class="mb-3">
                <input autocomplete="off" autofocus class="form-control" name="username"
                       placeholder="Username" type="text" value="{{ username }}" required>
            </div>
            <div class="mb-3">
                <input class="form-control" name="password" placeholder="Password (at least 8 characters)"
                       type="password" minlength="8" required>
            </div>
            <div class="mb-3">
                <input class="form-control" name="confirmation" placeholder="Password (again)"
                       type="password" minlength="8" required>
            </div>
            <button class="btn btn-warning w-100" type="submit">Register</button>
        </form>
        <p class="mt-3 text-center text-body-secondary">Already have an account? <a href="/login">Log in</a></p>
    </div>
{% endblock %}
